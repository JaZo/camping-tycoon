name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Versienummer invullen (cache-busting)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/$V/g" public/index.html
          echo "{\"v\":\"$V\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/version.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
